<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5a52ff" stop-opacity=".68"/>
      <stop offset=".45" stop-color="#433bff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2f27ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#433bff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#2f27ce" stop-opacity=".26"/>
      <stop offset="1" stop-color="#050315" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dedcff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#dedcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f27ce" stop-opacity="0"/>
      <stop offset=".45" stop-color="#433bff" stop-opacity=".44"/>
      <stop offset="1" stop-color="#2f27ce" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dedcff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#dedcff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#433bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dedcff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#dedcff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#dedcff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Gradient-only light pools — no blur filters, so they paint once and stay cheap -->
  <ellipse cx="1240" cy="220" rx="600" ry="450" fill="url(#violet)"/>
  <ellipse cx="180" cy="720" rx="560" ry="410" fill="url(#indigo)"/>
  <ellipse cx="820" cy="500" rx="400" ry="330" fill="url(#lavender)"/>
  <ellipse cx="1500" cy="820" rx="380" ry="290" fill="url(#indigo)"/>
  <ellipse cx="480" cy="120" rx="340" ry="240" fill="url(#violet)" opacity=".5"/>

  <!-- Haikei-style layered waves -->
  <path d="M0 628 C 210 548 410 742 720 656 C 1030 570 1310 512 1600 626 L1600 900 L0 900 Z" fill="url(#wave1)"/>
  <path d="M0 742 C 280 660 500 812 820 736 C 1120 664 1380 700 1600 760 L1600 900 L0 900 Z" fill="url(#wave2)"/>
  <path d="M0 812 C 320 760 620 868 960 812 C 1240 766 1420 806 1600 842" fill="none" stroke="url(#hair)" stroke-width="1.5"/>
  <path d="M0 560 C 260 500 460 650 760 590 C 1060 530 1320 470 1600 570" fill="none" stroke="url(#hair)" stroke-width="1" opacity=".55"/>

  <!-- faint star / sparkle field -->
  <g fill="#dedcff">
    <circle cx="180" cy="150" r="1.6" opacity=".6"/>
    <circle cx="340" cy="300" r="1" opacity=".45"/>
    <circle cx="520" cy="120" r="1.3" opacity=".55"/>
    <circle cx="700" cy="260" r="1" opacity=".38"/>
    <circle cx="980" cy="140" r="1.8" opacity=".6"/>
    <circle cx="1140" cy="340" r="1" opacity=".45"/>
    <circle cx="1380" cy="180" r="1.4" opacity=".55"/>
    <circle cx="1500" cy="420" r="1" opacity=".38"/>
    <circle cx="260" cy="520" r="1.2" opacity=".4"/>
    <circle cx="640" cy="430" r="1" opacity=".32"/>
  </g>
</svg>
